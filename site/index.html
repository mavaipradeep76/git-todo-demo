<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My To-Do App</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">GIT · GITHUB · CI/CD</p>
    <h1>My To-Do App</h1>
    <p>Small steps. Daily progress.</p>
    <form id="task-form">
      <label for="task-input" class="input-label">New task</label>
      <div class="entry"><input id="task-input" maxlength="200" placeholder="Learn Git commands" required><button>Add task</button></div>
    </form>
    <p id="count"></p>
    <ul id="tasks"></ul>
    <p id="status" role="status"></p>
    <footer>Tasks are saved in this browser.</footer>
  </main>
</body>
</html>
